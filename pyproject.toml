[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miapi-sdk"
version = "1.1.1"
description = "Official Python client for MIAPI — Grounded AI Answers API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "MIAPI", email = "support@miapi.uk"},
]
keywords = ["ai", "search", "api", "grounded", "answers", "citations", "llm", "rag"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28.0",
]

# The MCP server is optional: `pip install "miapi-sdk[mcp]"` pulls what it needs
# so plain SDK users are not made to install an MCP stack they will never run.
[project.optional-dependencies]
mcp = [
    "mcp[cli]>=1.2.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
miapi-mcp = "miapi.mcp_server:main"

[project.urls]
Homepage = "https://miapi.uk"
Documentation = "https://miapi.uk/#docs"
Repository = "https://github.com/Doyukndr/miapi-python"
Issues = "https://github.com/Doyukndr/miapi-python/issues"
